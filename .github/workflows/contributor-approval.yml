name: Contributor PR approval

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  approval:
    name: Owner approval for contributor PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out target-branch approval policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Test approval policy
        if: hashFiles('scripts/test_check_owner_approval.py') != ''
        run: python3 -m unittest discover -s scripts -p 'test_check_owner_approval.py' -v

      - name: Check owner approval for the current commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED_APPROVER: ${{ github.repository_owner }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ -f scripts/check_owner_approval.py ]]; then
            python3 scripts/check_owner_approval.py
          elif [[ "$PR_AUTHOR" == "$REQUIRED_APPROVER" ]]; then
            echo "The repository owner is bootstrapping the approval policy; owner-authored PRs are exempt."
          else
            echo "::error::The approval policy is not on the target branch yet. Only the repository owner can bootstrap it."
            exit 1
          fi
