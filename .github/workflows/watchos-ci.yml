name: Apple Watch CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Swift counter tests and watchOS build
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test platform-independent counter logic
        run: swift test --package-path watchos/GauraMalaCore

      - name: Initialize CodeQL for Swift
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build standalone watchOS app for Simulator
        run: >-
          xcodebuild
          -project watchos/GauraMala.xcodeproj
          -scheme GauraMalaWatch
          -sdk watchsimulator
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GauraMalaDerived"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build and validate watch-only distribution archive
        shell: bash
        run: |
          archive="$RUNNER_TEMP/GauraMala.xcarchive"
          xcodebuild \
            -project watchos/GauraMala.xcodeproj \
            -scheme GauraMala \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$RUNNER_TEMP/GauraMalaDerived" \
            -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

          container_app="$archive/Products/Applications/GauraMala.app"
          watch_app="$container_app/Watch/GauraMalaWatch.app"
          widget="$watch_app/PlugIns/GauraMalaWidgetExtension.appex"
          test -d "$container_app"
          test -d "$watch_app"
          test -d "$widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$container_app/Info.plist")" = "com.gauramala.watchos"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$watch_app/Info.plist")" = "com.gauramala.watchos.watchkitapp"
          echo "Validated watch-only container, watch app, and widget extension in archive."

      - name: Analyze Swift with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:swift'
