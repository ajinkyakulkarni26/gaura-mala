name: Apple Watch CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Swift counter tests and watchOS build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test platform-independent counter logic
        run: swift test --package-path watchos/GauraMalaCore

      - name: Initialize CodeQL for Swift
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: swift
          build-mode: manual

      - name: Build standalone watchOS app for Simulator
        run: >-
          xcodebuild
          -project watchos/GauraMala.xcodeproj
          -scheme GauraMalaWatch
          -sdk watchsimulator
          -destination 'generic/platform=watchOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/GauraMalaDerived"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Analyze Swift with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:swift'
