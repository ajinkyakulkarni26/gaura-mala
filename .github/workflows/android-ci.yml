name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # GitHub's Ubuntu image names the API 37 platform android-37.0;
      # this project asks Android Gradle Plugin for android-37.
      - name: Add API 37 SDK platform alias when needed
        shell: bash
        run: |
          sdk_platforms="${ANDROID_HOME}/platforms"
          if [[ -d "${sdk_platforms}/android-37.0" && ! -e "${sdk_platforms}/android-37" ]]; then
            ln -s android-37.0 "${sdk_platforms}/android-37"
          fi

      - name: Run JVM unit tests
        run: ./gradlew :app:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
