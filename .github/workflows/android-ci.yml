name: Android CI

on:
  # Run on every contributor branch push as well as on pull requests.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests, coverage gate, and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Test repository policy scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # GitHub's Ubuntu image names the API 37 platform android-37.0;
      # this project asks Android Gradle Plugin for android-37.
      - name: Add API 37 SDK platform alias when needed
        shell: bash
        run: |
          sdk_platforms="${ANDROID_HOME}/platforms"
          if [[ -d "${sdk_platforms}/android-37.0" && ! -e "${sdk_platforms}/android-37" ]]; then
            ln -s android-37.0 "${sdk_platforms}/android-37"
          fi

      - name: Run JVM unit tests and enforce core coverage
        run: ./gradlew :app:verifyCoreLogicCoverage

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'

      - name: Save JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore

  wear-os-integration:
    name: Wear OS emulator input tests
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Wear OS UI integration tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          system-image-api-level: 35-ext15
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            # Create the AGP alias only after the action has finished SDK manager setup.
            sdk_platforms="${ANDROID_HOME}/platforms"
            if [[ -d "${sdk_platforms}/android-37.0" && ! -e "${sdk_platforms}/android-37" ]]; then
              ln -s android-37.0 "${sdk_platforms}/android-37"
            fi
            set +e
            ./gradlew :app:connectedDebugAndroidTest
            test_status=$?
            python3 scripts/print-android-test-results.py
            report_status=$?
            if [ "$test_status" -ne 0 ]; then
              exit "$test_status"
            fi
            exit "$report_status"

      - name: Save Wear OS instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wear-os-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
