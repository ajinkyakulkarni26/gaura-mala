name: Android CI

on:
  # Run on every contributor branch push as well as on pull requests.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests, coverage gate, and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: enhanced
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Test repository policy scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Lint GitHub Actions and shell scripts
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck is required for CI workflow shell validation" >&2
            exit 1
          fi
          shellcheck scripts/*.sh

      # GitHub's Ubuntu image names the API 37 platform android-37.0;
      # this project asks Android Gradle Plugin for android-37.
      - name: Add API 37 SDK platform alias when needed
        shell: bash
        run: |
          sdk_platforms="${ANDROID_HOME}/platforms"
          if [[ -d "${sdk_platforms}/android-37.0" && ! -e "${sdk_platforms}/android-37" ]]; then
            ln -s android-37.0 "${sdk_platforms}/android-37"
          fi

      - name: Run JVM unit tests and enforce core coverage
        run: ./gradlew :app:verifyCoreLogicCoverage

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify 64-bit native libraries are packaged
        run: bash scripts/check-native-abis.sh

      - name: Build release AAB and check native ABIs and symbols
        shell: bash
        run: |
          ci_keystore="${RUNNER_TEMP}/gaura-ci-upload.jks"
          ci_password="$(openssl rand -hex 24)"
          trap 'rm -f "$ci_keystore"' EXIT
          keytool -genkeypair -noprompt \
            -keystore "$ci_keystore" \
            -storepass "$ci_password" \
            -keypass "$ci_password" \
            -alias gaura-ci \
            -dname "CN=Gaura Mala CI" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2
          ./gradlew :app:bundleRelease \
            -PGAURA_UPLOAD_STORE_FILE="$ci_keystore" \
            -PGAURA_UPLOAD_STORE_PASSWORD="$ci_password" \
            -PGAURA_UPLOAD_KEY_ALIAS=gaura-ci \
            -PGAURA_UPLOAD_KEY_PASSWORD="$ci_password"
          python3 scripts/check_release_aab.py app/build/outputs/bundle/release/app-release.aab

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:java-kotlin'

      - name: Save JaCoCo report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore

  wear-os-integration:
    name: Wear OS emulator input tests
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: enhanced
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Wear OS UI integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          system-image-api-level: 35-ext15
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-wear-os-integration-tests.sh
        env:
          WEAR_TEST_DEVICE_PROFILE: wearos_large_round
          WEAR_TEST_FONT_SCALE: "1.0"
          WEAR_TEST_RUN_LABEL: large-round-default-font

      - name: Run Wear OS UI integration tests (small round, enlarged font)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          system-image-api-level: 35-ext15
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-wear-os-integration-tests.sh
        env:
          WEAR_TEST_DEVICE_PROFILE: wearos_small_round
          WEAR_TEST_FONT_SCALE: "1.3"
          WEAR_TEST_RUN_LABEL: small-round-large-font

      - name: Save Wear OS instrumentation results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wear-os-instrumentation-results
          path: ${{ runner.temp }}/wear-os-test-results/
          if-no-files-found: ignore
