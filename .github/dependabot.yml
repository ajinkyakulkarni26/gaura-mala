version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-root-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      wear-tiles-protolayout:
        applies-to: version-updates
        patterns:
          - "androidx.wear.tiles:*"
          - "androidx.wear.protolayout:*"
        update-types:
          - minor
          - patch
      app-routine:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "androidx.wear.tiles:*"
          - "androidx.wear.protolayout:*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
